# Mosquitto-oppsett for utvikling på lokalt nettverk.
# Start:  mosquitto -c mosquitto/mosquitto.conf -v
#
# OBS: allow_anonymous er greit hjemme/på skolen, men legg til
# brukernavn/passord (password_file) før systemet brukes utenfor et lukket nett.

listener 1883 0.0.0.0
allow_anonymous true
persistence false
